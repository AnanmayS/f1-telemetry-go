# One small VPS: the server on localhost:8080 and a Cloudflare Tunnel in
# front of it for HTTPS and caching. Put the tunnel token in deploy/.env
# (TUNNEL_TOKEN=...), which is gitignored.
services:
  ghostlap:
    build: ..
    restart: unless-stopped
    command: ["-addr", ":8080", "-data", "/data", "-static", "/srv/web", "-trust-proxy"]
    volumes:
      - ../data:/data:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  cloudflared:
    image: cloudflare/cloudflared:2025.11.1  # pin; bump deliberately
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [ghostlap]
