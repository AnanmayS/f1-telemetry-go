<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ghostlap: compare two F1 laps</title>
    <meta name="description" content="Overlay two laps and see where the time was won and lost: delta, speed, throttle, brake, gear, RPM and DRS by distance." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ghostlap" />
    <meta property="og:title" content="ghostlap: compare two F1 laps" />
    <meta property="og:description" content="Overlay two laps and see where the time was won and lost: delta, speed, throttle, brake, gear, RPM and DRS by distance." />
    <meta name="twitter:card" content="summary" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101214'/%3E%3Cpath d='M4 22c5-12 9-12 12-6s7 6 12-6' fill='none' stroke='%235aa9ff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M4 16c5-8 9-8 12-2s7 4 12-2' fill='none' stroke='%23ff8000' stroke-width='3' stroke-linecap='round' stroke-dasharray='4 4'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="top">
      <h1>ghostlap</h1>
      <p class="tag">Compare two laps by distance</p>
    </header>

    <main id="app">
      <form id="picker" class="picker" aria-label="Lap selection" hidden></form>

      <section id="summary" class="summary" aria-live="polite" hidden></section>

      <p id="status" class="status" role="status">Loading sessions…</p>

      <div id="compare" class="compare" hidden>
        <aside class="side" aria-label="Values at cursor">
          <canvas id="map" class="map" role="img" aria-label="Track outline of lap A with the cursor position"></canvas>
          <dl id="readout" class="readout"></dl>
        </aside>
        <div id="charts" class="charts"></div>
      </div>
    </main>

    <footer class="foot">
      <p>
        Unofficial. Not associated with Formula 1 companies. Data from <a href="https://openf1.org" rel="noopener">OpenF1</a>.
      </p>
      <p><a href="https://github.com/AnanmayS/f1-telemetry-go" rel="noopener">Source on GitHub</a></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
